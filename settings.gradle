pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.moddev') useModule("net.neoforged:moddev-gradle:${requested.version}")
        }
    }
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
rootProject.name = 'ae2-upload-sidebar'
